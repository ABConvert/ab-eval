[project]
name = "model-eval-harness"
version = "0.1.0"
description = "Benchmark AI models on your own codebase, using pull requests your team already merged"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ABConvert" }]
requires-python = ">=3.11"
keywords = ["llm", "benchmark", "evaluation", "coding-agents", "swe-bench"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "anthropic>=1.4,<2",
  "deepeval>=4.2,<5",
  "langfuse>=4.15,<5",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  # The SDK runs the Claude Code CLI it bundles, not the one on PATH; 0.2.158 bundles the first
  # CLI that knows claude-opus-5-5.
  "claude-agent-sdk>=0.2.158",
  "mcp>=1.0",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]

[project.scripts]
eval-harness = "eval_harness.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pre-commit>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

# An allow-list, not the default of "everything git tracks": a checkout used for real
# benchmarking holds data/ and results/, and those are the team's own source code.
[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "docker", "config/models.example.yaml",
  "README.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md",
  "pyproject.toml", "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "docker: needs a running Docker daemon and a configured repository clone",
  "deepeval: scores a real run; set EVAL_RUN_ID",
]
addopts = "-m 'not docker and not deepeval'"
# A test that drives code on threads passes vacuously when a thread raises: pytest only warns.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
