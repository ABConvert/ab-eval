# Models the unit tests configure against. Like repos.yaml beside it, deliberately not anyone's
# real config: no test should depend on which models an operator happens to have set up.
demo-api:
  provider: anthropic
  model: demo-model-1
  effort: high
  max_output_tokens: 16000
  price_per_mtok: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
demo-compat:
  provider: openai-compat
  model: demo-compat-1
  base_url: https://example.invalid/v1
  api_key_env: DEMO_API_KEY
  effort: high
  max_output_tokens: 16000
judge:
  provider: anthropic
  model: demo-judge-1
  effort: medium
  max_output_tokens: 4000
classifier:
  provider: anthropic
  model: demo-model-1
  effort: low
  max_output_tokens: 500
